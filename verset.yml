name: Verset du Coran

on:
  schedule:
    - cron: "0 * * * *"   # toutes les heures, pile (heure UTC)
  workflow_dispatch:       # permet de le lancer à la main (bouton "Run workflow")

jobs:
  envoyer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Envoyer un verset
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python verset.py
